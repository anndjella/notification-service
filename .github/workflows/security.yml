name: Security

# two checks: no committed secrets, no NuGet package with a known CVE.
#
# Weekly in the background

on:
  schedule:
    - cron: "42 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  vulnerable-dependencies:
    name: Vulnerable NuGet packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore NotificationService.sln --configfile NuGet.Config

      - name: Report all vulnerable packages (informational)
        shell: bash
        run: |
          set -eo pipefail
          report=$(dotnet list NotificationService.sln package --vulnerable --include-transitive)
          echo "$report"
          {
            echo "## Vulnerable dependency scan (incl. transitive)"
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on directly-referenced vulnerable packages
        shell: bash
        run: |
          set -eo pipefail
          report=$(dotnet list NotificationService.sln package --vulnerable)
          echo "$report"
          if echo "$report" | grep -q "has the following vulnerable packages"; then
            echo "::error::A directly-referenced NuGet package has a known vulnerability."
            exit 1
          fi
          echo "No vulnerable direct dependencies."
