name: Notification Service CI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 8)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore NotificationService.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build NotificationService.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/NotificationService.UnitTests/NotificationService.Tests.csproj --configuration Release --no-build --verbosity normal
