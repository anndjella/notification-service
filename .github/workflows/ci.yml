name: Notification Service CI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: func-notification-swc

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 8)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore NotificationService.sln --configfile NuGet.Config

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build NotificationService.sln --configuration Release --no-restore

      - name: Run tests
        shell: bash
        run: >
          dotnet test tests/NotificationService.UnitTests/NotificationService.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults
          --settings coverlet.runsettings

      - name: Coverage report
        if: always()
        shell: bash
        run: |
          dotnet tool run reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./TestResults/coveragereport" \
            -reporttypes:"Html;MarkdownSummaryGithub;TextSummary;Badges"
          {
            echo "## Test coverage"
            echo
            cat ./TestResults/coveragereport/SummaryGithub.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-and-coverage
          path: ./TestResults
          retention-days: 30

      - name: Publish Function App
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: dotnet publish src/NotificationService.Functions/NotificationService.Functions.csproj --configuration Release --no-build --output ./publish

      - name: Upload Function App artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: notification-service
          path: ./publish
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy Function App to Azure
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-notification-service
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      NOTIFICATION_BASE_URL: https://func-notification-swc.azurewebsites.net

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Function App artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: notification-service
          path: ./publish

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Function App
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish

      - name: Smoke test
        id: smoke
        run: bash .github/scripts/smoke-test.sh "$NOTIFICATION_BASE_URL"

      - name: Find previous good release
        id: prev
        if: failure()
        run: |
          set -eo pipefail
          PREV_RUN_ID=$(gh run list \
            --workflow ci.yml --branch master --event push --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$PREV_RUN_ID" ]; then
            echo "::error::No previous successful run to roll back to."
            exit 1
          fi
          echo "run_id=$PREV_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download previous release
        if: failure() && steps.prev.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: notification-service
          path: ./rollback
          run-id: ${{ steps.prev.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Roll back
        if: failure() && steps.prev.outputs.run_id != ''
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./rollback

      - name: Verify rollback and fail the run
        if: failure() && steps.prev.outputs.run_id != ''
        run: |
          echo "::warning::Bad deploy was rolled back to run ${{ steps.prev.outputs.run_id }}."
          bash .github/scripts/smoke-test.sh "$NOTIFICATION_BASE_URL"
          echo "::notice::Previous release is healthy and live. Run left red so the failed deploy gets investigated."
          exit 1
