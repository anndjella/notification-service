name: Notification Service CI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: student-exam-notifications-2610

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 8)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore NotificationService.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build NotificationService.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/NotificationService.UnitTests/NotificationService.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Publish Function App
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: dotnet publish src/NotificationService.Functions/NotificationService.Functions.csproj --configuration Release --no-build --output ./publish

      - name: Upload Function App artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: notification-service
          path: ./publish
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Function App to Azure
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Function App artifact
        uses: actions/download-artifact@v4
        with:
          name: notification-service
          path: ./publish

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish
